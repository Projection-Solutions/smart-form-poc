<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Form Assistant - PoC</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f4f6f8; color: #1e293b; display: flex; height: 100vh; }

    /* Left Panel: AI Agent */
    .agent-panel {
      width: 360px; background: #ffffff; border-right: 1px solid #cbd5e1;
      display: flex; flex-direction: column; padding: 16px;
    }
    .agent-header { border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 12px; }
    .agent-header h2 { margin: 0 0 8px 0; font-size: 1.1rem; color: #0f172a; }
    .api-bar { display: flex; gap: 6px; }
    .api-bar input { flex: 1; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.85rem; }
    .api-bar button { padding: 6px 10px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }

    .chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
    .msg { padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; line-height: 1.4; max-width: 90%; }
    .msg.ai { background: #f1f5f9; color: #0f172a; align-self: flex-start; border: 1px solid #e2e8f0; }
    .msg.user { background: #2563eb; color: #ffffff; align-self: flex-end; }
    .load-btn {
      display: block; margin-top: 8px; padding: 6px 10px; background: #059669;
      color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
    }
    .load-btn:hover { background: #047857; }

    .chat-input { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
    .chat-input input { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .chat-input button { padding: 8px 14px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }

    /* Right Panel: Printable Form */
    .form-workspace { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .toolbar { width: 100%; max-width: 700px; display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; }
    .toolbar button {
      padding: 8px 16px; border: 1px solid #cbd5e1; background: #ffffff;
      color: #0f172a; border-radius: 4px; cursor: pointer; font-weight: 600;
    }
    .toolbar button.primary { background: #0f172a; color: #ffffff; border-color: #0f172a; }

    .paper-form {
      width: 100%; max-width: 700px; background: #ffffff; padding: 40px;
      border: 1px solid #cbd5e1; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .paper-form h1 { margin-top: 0; border-bottom: 2px solid #0f172a; padding-bottom: 10px; font-size: 1.5rem; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .field input, .field textarea {
      width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; color: #0f172a;
    }
    .field textarea { height: 90px; resize: vertical; }

    /* Print Stylesheet: Hides AI & Buttons */
    @media print {
      body { background: #ffffff; height: auto; display: block; }
      .agent-panel, .toolbar { display: none !important; }
      .form-workspace { padding: 0; overflow: visible; }
      .paper-form { border: none; box-shadow: none; padding: 0; max-width: 100%; }
      .field input, .field textarea { border: 1px solid #94a3b8; }
    }
  </style>
</head>
<body>

  <!-- AI Agent Sidebar -->
  <div class="agent-panel">
    <div class="agent-header">
      <h2>Form Assistant</h2>
      <div class="api-bar">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key...">
        <button onclick="saveKey()">Save</button>
      </div>
    </div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Hello! Ask me what forms are available, or tell me what you need to fill out.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="e.g., Show available forms" onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Main Document Workspace -->
  <div class="form-workspace">
    <div class="toolbar">
      <button onclick="clearForm()">Clear Form</button>
      <button onclick="downloadHTML()">Download File</button>
      <button class="primary" onclick="window.print()">Print / Save PDF</button>
    </div>

    <div class="paper-form" id="printableArea">
      <h1 id="displayTitle">Blank Standard Form</h1>
      <div class="field">
        <label>Form Title</label>
        <input type="text" id="formTitle" oninput="document.getElementById('displayTitle').innerText = this.value || 'Blank Standard Form'">
      </div>
      <div class="field">
        <label>Department</label>
        <input type="text" id="department">
      </div>
      <div class="field">
        <label>Priority Level</label>
        <input type="text" id="priority">
      </div>
      <div class="field">
        <label>Summary / Description</label>
        <textarea id="summary"></textarea>
      </div>
      <div class="field">
        <label>Additional Notes</label>
        <textarea id="notes"></textarea>
      </div>
    </div>
  </div>

  <script>
    // 1. CONFIGURATION: Update your GitHub username below
    const GITHUB_USER = "projection-solutions";
    const CATALOG_REPO = "json-catalog-poc";
    const BASE_RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${CATALOG_REPO}/main/`;

    let catalogData = [];

    // 2. INITIALIZE: Load API key & fetch catalog from Repo A
    window.onload = async () => {
      const savedKey = localStorage.getItem("gemini_poc_key");
      if (savedKey) document.getElementById("apiKeyInput").value = savedKey;

      try {
        const res = await fetch(BASE_RAW_URL + "catalog.json");
        catalogData = await res.json();
      } catch (err) {
        addMessage("ai", "Warning: Could not reach catalog.json. Check your GITHUB_USER setting in index.html.");
      }
    };

    function saveKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      localStorage.setItem("gemini_poc_key", key);
      addMessage("ai", "API key saved to your browser.");
    }

    // 3. LOAD JSON INTO FORM
    async function loadTemplate(filePath) {
      try {
        const res = await fetch(BASE_RAW_URL + filePath);
        const data = await res.json();

        document.getElementById("formTitle").value = data.formTitle || "";
        document.getElementById("displayTitle").innerText = data.formTitle || "Standard Form";
        document.getElementById("department").value = data.department || "";
        document.getElementById("priority").value = data.priority || "";
        document.getElementById("summary").value = data.summary || "";
        document.getElementById("notes").value = data.notes || "";

        addMessage("ai", `Loaded "${data.formTitle}" into the form. You can edit any field or click Print.`);
      } catch (err) {
        addMessage("ai", "Error loading that template file.");
      }
    }

    // 4. AI AGENT COMMUNICATION (Gemini REST API)
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      const apiKey = localStorage.getItem("gemini_poc_key");

      if (!text) return;
      if (!apiKey) {
        addMessage("ai", "Please paste and save your Gemini API key at the top left first.");
        return;
      }

      addMessage("user", text);
      input.value = "";

      const systemInstruction = `
        You are a helpful form assistant. Here is the live JSON catalog of available templates:
        ${JSON.stringify(catalogData)}

        Rules:
        1. Help the user find the right template from the catalog.
        2. Keep responses concise and friendly for non-technical users.
        3. Whenever you recommend or select a template, include this exact tag at the end of your reply: [LOAD:file_path] (for example: [LOAD:templates/equipment.json]).
      `;

      try {
       const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "x-goog-api-key": apiKey
          },
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: systemInstruction }] },
            contents: [{ role: "user", parts: [{ text: text }] }]
          })
        });

        const result = await response.json();
        let reply = result.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I had trouble connecting.";

        // Check if the AI included a [LOAD:...] trigger
        const match = reply.match(/\[LOAD:(.*?)\]/);
        let fileToLoad = null;
        if (match) {
          fileToLoad = match[1].trim();
          reply = reply.replace(match[0], "").trim();
          // Automatically load it for zero-friction UX
          await loadTemplate(fileToLoad);
        }

        addMessage("ai", reply, fileToLoad);
      } catch (err) {
        addMessage("ai", "Error contacting Gemini API. Check your API key.");
      }
    }

    // 5. UI & DOWNLOAD HELPERS
    function addMessage(sender, text, fileToLoad = null) {
      const box = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.innerText = text;

      if (fileToLoad) {
        const btn = document.createElement("button");
        btn.className = "load-btn";
        btn.innerText = "Reload Template";
        btn.onclick = () => loadTemplate(fileToLoad);
        div.appendChild(btn);
      }

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function clearForm() {
      ["formTitle", "department", "priority", "summary", "notes"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("displayTitle").innerText = "Blank Standard Form";
    }

    function downloadHTML() {
      const title = document.getElementById("formTitle").value || "completed-form";
      const content = `
        <html><body style="font-family:sans-serif; padding:40px; max-width:700px;">
        <h1>${document.getElementById("formTitle").value}</h1>
        <p><strong>Department:</strong> ${document.getElementById("department").value}</p>
        <p><strong>Priority:</strong> ${document.getElementById("priority").value}</p>
        <p><strong>Summary:</strong><br>${document.getElementById("summary").value}</p>
        <p><strong>Notes:</strong><br>${document.getElementById("notes").value}</p>
        </body></html>
      `;
      const blob = new Blob([content], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = title.toLowerCase().replace(/\s+/g, "-") + ".html";
      a.click();
    }
  </script>
</body>
</html>
